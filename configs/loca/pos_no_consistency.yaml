benchmark: LOCA-Bench
method: ReAct-PoS
harness: ReAct
loca_environment_length: 8k
loca_task_names: all
loca_seeds:
- 42
- 123
- 456
- 789
- 2024
# Case indices use the half-open interval [start_case, end_case).
start_case: 0
end_case: 75
skip_existing: true
# Worker crashes are retried; completed result files are not rerun.
run_until_complete: true
restart_delay_seconds: 10
max_steps: 100
loca_max_tool_uses: 100
loca_tool_timeout_seconds: 120
include_actions: true
loca_observation_artifacts:
  enabled: true
  inline_max_chars: 8000
  preview_items: 3
  structured_only: true
model: qwen3.7-plus
base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
api_key_env: DASHSCOPE_API_KEY
temperature: 0
max_tokens: 4096
max_json_retries: 1
extra_body:
  enable_thinking: false
  response_format:
    type: json_object
context:
  type: belief
  task_mode: execution
  update_every_steps: 1
  agent_view: hybrid
  # Progress is 1 only when the absolute inferred-confidence distance exceeds this threshold.
  diagnostic_progress_threshold: 0.3
  model:
    model: qwen3.7-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0
    max_tokens: 4096
    max_json_retries: 1
    extra_body:
      enable_thinking: false
      response_format:
        type: json_object
  sentinel:
    enabled: true
    local_audit_every_steps: 1
    global_audit_every_steps: 32
    recent_transition_count: 4
    consistency_model:
      model: qwen3.7-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      temperature: 0
      max_tokens: 512
      max_json_retries: 1
      extra_body:
        enable_thinking: false
        response_format:
          type: json_object
    progress_model:
      model: qwen3.7-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      temperature: 0
      max_tokens: 512
      max_json_retries: 1
      extra_body:
        enable_thinking: false
        response_format:
          type: json_object
    consistency_enabled: false
    progress_enabled: true
  # Use the latest K verified transitions, including frontier changes.
  trapping:
    enabled: true
    window_size: 8
    recurrence_epsilon: 0.15
    max_cycle_length: 4
    health_threshold: 0.25
    cycle_threshold: 0.75
  # Recovery constrains the policy; it does not directly execute actions.
  recovery:
    enabled: true
    recent_low_progress_count: 4
output_run_name: qwen3.7-plus-pos_no_consistency
