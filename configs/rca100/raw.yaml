benchmark: RCA100
method: ReAct
harness: ReAct
rca_task_ids: all
# Case indices use the half-open interval [start_case, end_case).
start_case: 0
end_case: 103
rca_tools_module: benchmarks/RCA100/tools.py
rca_observation_max_chars: 20000
skip_existing: true
# Worker crashes are retried; completed result files are not rerun.
run_until_complete: true
restart_delay_seconds: 10
max_steps: 50
max_actions_per_turn: 3
include_actions: true
model: qwen3.7-plus
base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
api_key_env: DASHSCOPE_API_KEY
temperature: 0
max_tokens: 4096
max_json_retries: 2
extra_body:
  enable_thinking: false
  response_format:
    type: json_object
output_run_name: qwen3.7-plus-raw
context:
  type: raw
